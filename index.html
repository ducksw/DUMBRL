<center>
<button id="capturar" onclick="capture()">Descargar</button>
<button id="compartir" onclick="copiarContenido()">Compartir Enlace</button>
</center>

<div id="txt" style="color: black"></div>
</body>

<script>

function ext() {
  let name = document.getElementById('name').value;
  let nm = document.getElementById('nm');
  let firm = document.getElementById('firm');

  nm.innerHTML = name;
  firm.innerHTML = name;

  console.log(name);
  mostrar();
}

function mostrar(){
  var archivo = document.getElementById("file").files[0];
  var reader = new FileReader();
  if (file) {
    reader.readAsDataURL(archivo );
    reader.onloadend = function () {
      document.getElementById("img").src = reader.result;
      console.log(reader.result);
    }
  }
}

function capture() {
  let div = document.getElementById("box");

  html2canvas(div).then(canvas => {
    let imgURL = canvas.toDataURL("image/png");
    let link = document.createElement("a");
    link.href = imgURL;
    link.download = "carnet.png";
    link.click();
  });
}

var link = location.href;
var texto = document.getElementById('txt').innerHTML = link;
const copiarContenido = async () => {
  try {
    await navigator.clipboard.writeText(texto);
    const msg = "El enlace ha sido copiado en su portapapeles. Ahora puede compartirlo!!";
    alert(msg);
  } catch (err) {
    console.error('Error al copiar: ', err);
  }
}
</script>
